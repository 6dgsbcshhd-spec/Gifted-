<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Secret Letter</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:#fff;font-family:Arial,sans-serif;overflow:hidden}.screen{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:25px}.active{display:flex}
#start{background:radial-gradient(circle at center,#302027 0%,#100c0c 52%,#030303 100%)}.heart{font-size:55px;animation:pulse 1.5s infinite}@keyframes pulse{50%{transform:scale(1.15);filter:brightness(1.5)}}#start h1{font-size:25px;line-height:1.5;letter-spacing:1px}#start button{margin-top:30px;padding:19px 25px;border:1px solid #e8a1bb;border-radius:12px;background:linear-gradient(135deg,#d68ca9,#8c3858);color:white;font-size:17px;box-shadow:0 0 30px #bd456b66;cursor:pointer}
#scareScreen{background:#000;padding:0}#scareScreen video{width:100%;height:100%;object-fit:cover}
#loading{background:radial-gradient(ellipse at center,#330000 0%,#130000 45%,#000 100%)}#loading:before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 3px,#ff000008 4px);pointer-events:none}.warning{color:#ff1717;font-size:15px;letter-spacing:7px;text-shadow:0 0 15px red;animation:flicker 1s infinite}@keyframes flicker{50%{opacity:.35}}.loadTitle{margin-top:25px;font-size:24px;font-weight:900;color:#ff2020;text-shadow:0 0 20px red}.percent{font-size:48px;color:#ff1616;margin:30px;text-shadow:0 0 25px red}.bar{width:85%;max-width:400px;height:8px;background:#290000;border:1px solid #8e0000}.fill{width:0%;height:100%;background:#ff1010;box-shadow:0 0 20px red}.glitch{animation:glitch .15s infinite}@keyframes glitch{0%{transform:translate(0)}25%{transform:translate(2px,-1px)}50%{transform:translate(-2px,1px)}75%{transform:translate(1px,2px)}}
#final{background:#090000}#final img{width:min(90vw,420px);max-height:65vh;object-fit:contain;filter:brightness(2.15) contrast(1.3) saturate(1.2)}#final h1{color:#ff1010;font-size:27px;text-shadow:0 0 20px red}
#blocked{background:linear-gradient(145deg,#dedede,#aaa);color:#252525}.lockIcon{font-size:65px;color:#444}#blocked h1{font-size:24px;font-weight:800}.ip{margin-top:25px;font-size:17px;color:#333}
</style></head><body>
<section id="start" class="screen active"><div class="heart">❤️</div><h1>У тебя есть секретное письмо...</h1><button id="openBtn">Нажми на меня и получишь секретное письмо ❤️</button></section>
<section id="scareScreen" class="screen"><video id="video" playsinline preload="auto"><source src="scare.mp4" type="video/mp4"></video></section>
<section id="loading" class="screen"><div class="warning glitch">SYSTEM ERROR</div><div class="loadTitle">КОПИРОВАНИЕ ДАННЫХ С ТЕЛЕФОНА</div><div class="percent" id="percent">0%</div><div class="bar"><div class="fill" id="fill"></div></div></section>
<section id="final" class="screen"><img src="end.webp" alt="Монстр"><h1>Зря посетил сайт…)</h1></section>
<section id="blocked" class="screen"><div class="lockIcon">🚨</div><h1>САЙТ ЗАБЛОКИРОВАН ИЛИ УДАЛЁН</h1><div class="ip">Ваш IP: <span id="ip"></span></div></section>
<script>
const screens=document.querySelectorAll('.screen');function show(id){screens.forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active')}
document.getElementById('ip').textContent='203.0.113.'+(Math.floor(Math.random()*200)+1);
if(localStorage.getItem('revenge_visited')){show('blocked')}else{localStorage.setItem('revenge_visited','yes');show('start')}
document.getElementById('openBtn').addEventListener('click',()=>{show('scareScreen');const video=document.getElementById('video');video.currentTime=0;video.muted=false;video.controls=false;video.play().catch(()=>{});setTimeout(()=>{video.pause();show('loading');let p=0;const fill=document.getElementById('fill'),percent=document.getElementById('percent');const timer=setInterval(()=>{p++;fill.style.width=p+'%';percent.textContent=p+'%';if(p>=100){clearInterval(timer);setTimeout(()=>show('final'),400)}},80)},4000)});
</script></body></html>
